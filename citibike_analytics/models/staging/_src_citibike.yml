version: 2

sources:
  - name: citibike_raw
    schema: citibike
    tables:
      - name: raw_citibike_tripdata
        columns:
          - name: ride_id
            data_type: string
          - name: rideable_type
            data_type: string
          - name: started_at
            data_type: string
          - name: ended_at
            data_type: string
          - name: start_station_name
            data_type: string
          - name: start_station_id
            data_type: string
          - name: end_station_name
            data_type: string
          - name: end_station_id
            data_type: string
          - name: start_lat
            data_type: string
          - name: start_lng
            data_type: string
          - name: end_lat
            data_type: string
          - name: end_lng
            data_type: string
          - name: member_casual
            data_type: string
          - name: source_locator
            data_type: string
          - name: ingested_at
            data_type: datetime64(3, 'utc')

      - name: stream_stations_status_raw

      - name: stream_station_information_raw