version: 2

models:
  - name: stg_citibike__baserow_maintenance_tickets
    description: >
      Maintenance tickets from the latest completed extraction
      of the configured Baserow table.

    columns:
      - name: baserow_row_id
        data_tests: [not_null, unique]

      - name: ticket_id
        data_tests: [not_null, unique]

      - name: station_code
        data_tests: [not_null]

      - name: reported_at
        data_tests: [not_null]

      - name: status
        data_tests: [not_null]

      - name: priority
        data_tests: [not_null]