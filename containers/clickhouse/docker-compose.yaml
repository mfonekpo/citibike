services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: clickhouse
    env_file:
      - ../../.env
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-citibike}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-pipeline}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    healthcheck:
      test:
        - CMD-SHELL
        - 'clickhouse-client --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"'
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  clickhouse-data:
  clickhouse-logs:

networks:
  default:
    name: citibike-network
    external: true