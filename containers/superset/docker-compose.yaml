name: citibike-superset

services:

  superset-db:
    image: postgres:16
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:?}
      POSTGRES_DB: superset

    volumes:
      - superset-postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U superset -d superset
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  superset-init:
    build:
      context: .

    environment: &superset-env
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?}

    depends_on:
      superset-db:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - superset db upgrade && superset init

    restart: "no"

  superset:
    build:
      context: .

    environment: *superset-env

    ports:
      - "127.0.0.1:8088:8088"

    depends_on:
      superset-init:
        condition: service_completed_successfully

    networks:
      - default
      - citibike-network

    restart: unless-stopped

volumes:
  superset-postgres:

networks:
  citibike-network:
    external: true